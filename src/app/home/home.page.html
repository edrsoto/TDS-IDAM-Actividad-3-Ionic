<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Actividad 3 Conversor USD / GTQ</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title class="ion-text-center">Conversor de Monedas</ion-card-title>
      <ion-card-subtitle class="ion-text-center">USD ↔ GTQ</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-item>
        <ion-label position="stacked">Tasa de cambio (1 USD en GTQ)</ion-label>
        <ion-input type="number" [(ngModel)]="tasaCambio" placeholder="Ej: 7.8"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Monto en Dólares ($ USD)</ion-label>
        <ion-input type="number" [(ngModel)]="dolares" placeholder="Ingrese monto en USD"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Monto en Quetzales (Q GTQ)</ion-label>
        <ion-input type="number" [(ngModel)]="quetzales" placeholder="Ingrese monto en GTQ"></ion-input>
      </ion-item>

      <div class="ion-padding-top">
        <ion-button expand="block" color="success" (click)="convertirDolaresAQuetzales()">
          USD → GTQ
        </ion-button>
        
        <ion-button expand="block" color="tertiary" (click)="convertirQuetzalesADolares()" class="ion-margin-top">
          GTQ → USD
        </ion-button>
        
        <ion-button expand="block" fill="outline" color="medium" (click)="limpiar()" class="ion-margin-top">
          Limpiar
        </ion-button>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
